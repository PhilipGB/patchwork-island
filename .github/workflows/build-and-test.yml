name: build-and-test

on:
  push:
    branches: [main, "p7.1-*", "p8-*"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install pinned Godot 4.7.2 .NET
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Build game
        run: dotnet build PatchworkIsland.sln

      - name: Run pure logic tests
        run: dotnet run --project tests/PatchworkIsland.Tests.csproj

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Boot main scene headlessly
        run: timeout 120 godot --headless --path . --quit-after 120
